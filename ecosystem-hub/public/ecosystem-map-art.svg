<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Bản đồ hệ sinh thái HIU TMC</title>
<desc id="desc">Bản đồ minh họa 2D phong cách hoạt hình Á Đông với bốn khu học tập Y học cổ truyền bao quanh quảng trường âm dương trung tâm.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff3f1"/>
    <stop offset=".48" stop-color="#e9f2df"/>
    <stop offset="1" stop-color="#f5e7c9"/>
  </linearGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#688d7c"/><stop offset="1" stop-color="#355d50"/>
  </linearGradient>
  <linearGradient id="mountain2" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#8ea995"/><stop offset="1" stop-color="#5d7e6f"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#9be4df"/><stop offset=".45" stop-color="#50b8bd"/><stop offset="1" stop-color="#2d7887"/>
  </linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#fff1cb"/><stop offset="1" stop-color="#d8b77f"/>
  </linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#214d49"/><stop offset=".7" stop-color="#173a39"/><stop offset="1" stop-color="#0e2c2d"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ae663f"/><stop offset="1" stop-color="#704028"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop stop-color="#fff3bd" stop-opacity=".96"/><stop offset="1" stop-color="#fff3bd" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cyanGlow">
    <stop stop-color="#7cf6ee" stop-opacity=".72"/><stop offset="1" stop-color="#7cf6ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#173d34" flood-opacity=".22"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="tiles" width="18" height="10" patternUnits="userSpaceOnUse">
    <path d="M0 9 Q9 2 18 9" fill="none" stroke="#2d5a55" stroke-width="2"/>
  </pattern>
</defs>

