name: Vercel Production

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_7DWP3LX30CFALUD1KoNeOR8NlpsQ
      VERCEL_PROJECT_NAME: yhct-hiu-final4-stage
      VERCEL_PRODUCTION_ALIAS: yhct-hiu-final4-stage.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GIT_REPO_OWNER: drngovothiennhan
      GIT_REPO_NAME: yhct-hiu-4-0
      CI_PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require production deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error title=Missing VERCEL_TOKEN::Production deploy is fail-closed."
            exit 78
          fi
          if ! [[ "$CI_PASSED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid CI commit::Unexpected commit SHA."
            exit 78
          fi

      - name: Verify Vercel token project access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          if [ "$status" != "200" ]; then
            detail="$(node - "$response_file" <<'NODE'
          const fs=require('node:fs');
          const file=process.argv[2];
          try {
            const body=JSON.parse(fs.readFileSync(file,'utf8'));
            const error=body?.error||body;
            process.stdout.write(String(error?.message||error?.code||'Access denied').slice(0,400));
          } catch {
            process.stdout.write('Unable to read Vercel API error');
          }
          NODE
            )"
            rm -f "$response_file"
            echo "::error title=VERCEL_TOKEN scope mismatch::Vercel project probe returned HTTP ${status}: ${detail}"
            exit 79
          fi
          rm -f "$response_file"
          echo "Vercel token can access production project."

      - name: Create production deployment from CI-passed commit
        id: create
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          node - "$request_file" <<'NODE'
          const fs=require('node:fs');
          const output=process.argv[2];
          const sha=process.env.CI_PASSED_SHA;
          const owner=process.env.GIT_REPO_OWNER;
          const repo=process.env.GIT_REPO_NAME;
          const body={
            name:process.env.VERCEL_PROJECT_NAME,
            project:process.env.VERCEL_PROJECT_ID,
            target:'production',
            gitSource:{type:'github',org:owner,repo,ref:sha},
            gitMetadata:{
              remoteUrl:`https://github.com/${owner}/${repo}`,
              commitRef:'main',
              commitSha:sha,
              ci:true,
              ciType:'github-actions',
              ciGitProviderUsername:owner,
              ciGitRepoVisibility:'public'
            }
          };
          fs.writeFileSync(output,JSON.stringify(body));
          NODE
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${request_file}" \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1")"
          rm -f "$request_file"
          if [[ "$status" != "200" && "$status" != "201" && "$status" != "202" ]]; then
            detail="$(node - "$response_file" <<'NODE'
          const fs=require('node:fs');
          try {
            const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const error=body?.error||body;
            process.stdout.write(String(error?.message||error?.code||'Deployment create failed').slice(0,600));
          } catch {
            process.stdout.write('Unable to read Vercel deployment error');
          }
          NODE
            )"
            rm -f "$response_file"
            echo "::error title=Vercel deployment creation failed::HTTP ${status}: ${detail}"
            exit 80
          fi
          deployment_id="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!b.id)process.exit(2);process.stdout.write(b.id)" "$response_file")"
          deployment_url="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(b.url||'')" "$response_file")"
          rm -f "$response_file"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=https://$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Created deployment: $deployment_id"

      - name: Wait for Vercel production readiness and alias binding
        id: ready
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.create.outputs.deployment_id }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 120); do
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"
            if [ "$status" != "200" ]; then
              echo "::warning::Deployment status probe HTTP ${status}; retrying."
              sleep 5
              continue
            fi
            state="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(b.readyState||b.status||'UNKNOWN')" "$response_file")"
            deployed_sha="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(b?.meta?.githubCommitSha||'')" "$response_file")"
            alias_bound="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(Array.isArray(b.alias)&&b.alias.includes(process.env.VERCEL_PRODUCTION_ALIAS)?'1':'0')" "$response_file")"
            echo "Vercel state: $state; production alias bound: $alias_bound"
            if [[ "$state" == "ERROR" || "$state" == "CANCELED" ]]; then
              echo "::error title=Vercel production failed::Deployment ${DEPLOYMENT_ID} entered ${state}."
              exit 81
            fi
            if [ "$state" = "READY" ]; then
              if [ -n "$deployed_sha" ] && [ "$deployed_sha" != "$CI_PASSED_SHA" ]; then
                echo "::error title=Commit mismatch::Vercel built ${deployed_sha}, expected ${CI_PASSED_SHA}."
                exit 82
              fi
              if [ "$alias_bound" = "1" ]; then
                echo "url=https://${VERCEL_PRODUCTION_ALIAS}" >> "$GITHUB_OUTPUT"
                echo "Production READY and alias bound: https://${VERCEL_PRODUCTION_ALIAS}"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error title=Vercel production timeout::Deployment/alias did not become ready within 10 minutes."
          exit 83

      - name: Checkout exact deployed commit for live Chrome QA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_PASSED_SHA }}
          fetch-depth: 1

      - name: Use CI-proven Node runtime for Chrome QA
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Real Google Chrome production smoke
        shell: bash
        env:
          CHROME_SMOKE_URL: ${{ steps.ready.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node scripts/chrome-real-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Production Chrome smoke failed::Chrome smoke failed after 3 isolated attempts."
              exit 1
            fi
            echo "::warning::Chrome smoke attempt ${attempt} hit a transient runner/CDP startup failure; cleaning Chrome and retrying."
            pkill -f 'google-chrome.*remote-debugging-port=9222' || true
            pkill -f 'google-chrome.*remote-debugging-port=9223' || true
            rm -rf /tmp/yhct-chrome-* || true
            sleep 2
          done

      - name: Upload production Chrome QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-chrome-smoke-${{ env.CI_PASSED_SHA }}
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish deployment summary
        run: |
          {
            echo "### Vercel production deployment"
            echo "- Commit: \`${CI_PASSED_SHA}\`"
            echo "- Deployment: \`${{ steps.create.outputs.deployment_id }}\`"
            echo "- Immutable URL: ${{ steps.create.outputs.deployment_url }}"
            echo "- Public production alias: ${{ steps.ready.outputs.url }}"
            echo "- Live Google Chrome smoke: passed on 390x844 mobile and 1440x1000 desktop"
          } >> "$GITHUB_STEP_SUMMARY"
