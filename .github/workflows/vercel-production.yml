name: Vercel Production

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_7DWP3LX30CFALUD1KoNeOR8NlpsQ
      VERCEL_PROJECT_NAME: yhct-hiu-final4-stage
      VERCEL_PRODUCTION_ALIAS: yhct-hiu-final4-stage.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GIT_REPO_OWNER: drngovothiennhan
      GIT_REPO_NAME: yhct-hiu-4-0
      CI_PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require release credentials and exact CI commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error title=Missing VERCEL_TOKEN::Production release is fail-closed."
            exit 78
          fi
          if ! [[ "$CI_PASSED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid CI commit::Unexpected commit SHA."
            exit 78
          fi

      - name: Checkout exact CI-passed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_PASSED_SHA }}
          fetch-depth: 1

      - name: Use CI-proven Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CI_PASSED_SHA" ]; then
            echo "::error title=Commit mismatch::Checked out ${actual}, expected ${CI_PASSED_SHA}."
            exit 79
          fi

      - name: Verify Vercel token project access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          if [ "$status" != "200" ]; then
            detail="$(node - "$response_file" <<'NODE'
          const fs=require('node:fs');
          try{const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const error=body?.error||body;process.stdout.write(String(error?.message||error?.code||'Access denied').slice(0,400))}catch{process.stdout.write('Unable to read Vercel API error')}
          NODE
            )"
            rm -f "$response_file"
            echo "::error title=VERCEL_TOKEN scope mismatch::Vercel project probe returned HTTP ${status}: ${detail}"
            exit 80
          fi
          rm -f "$response_file"
          echo "Vercel token can access production project."

      - name: Generate deployment-scoped Golden Eval credential
        shell: bash
        run: |
          set -euo pipefail
          key="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::${key}"
          echo "AI_GOLDEN_EPHEMERAL_KEY=${key}" >> "$GITHUB_ENV"

      - name: Generate ephemeral Vercel automation bypass
        shell: bash
        run: |
          set -euo pipefail
          bypass="$(node -e "process.stdout.write(require('node:crypto').randomBytes(16).toString('hex'))")"
          echo "::add-mask::${bypass}"
          export BYPASS_SECRET="$bypass"
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          node - "$request_file" <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({generate:{secret:process.env.BYPASS_SECRET,note:`HIU Golden ${process.env.CI_PASSED_SHA.slice(0,12)}`}}));
          NODE
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${request_file}" \
            "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_ORG_ID}")"
          rm -f "$request_file"
          if [ "$status" != "200" ]; then
            detail="$(cat "$response_file" | head -c 600)"
            rm -f "$response_file"
            echo "::error title=Automation bypass creation failed::HTTP ${status}: ${detail}"
            exit 80
          fi
          rm -f "$response_file"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=${bypass}" >> "$GITHUB_ENV"
          echo "Ephemeral Vercel automation bypass created for live gate."

      - name: Create staged production deployment without domain promotion
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          node - "$request_file" <<'NODE'
          const fs=require('node:fs');
          const output=process.argv[2],sha=process.env.CI_PASSED_SHA,owner=process.env.GIT_REPO_OWNER,repo=process.env.GIT_REPO_NAME;
          fs.writeFileSync(output,JSON.stringify({
            name:process.env.VERCEL_PROJECT_NAME,
            project:process.env.VERCEL_PROJECT_ID,
            target:'production',
            autoAssignCustomDomains:false,
            env:{AI_GOLDEN_EPHEMERAL_KEY:process.env.AI_GOLDEN_EPHEMERAL_KEY},
            gitSource:{type:'github',org:owner,repo,ref:sha},
            gitMetadata:{remoteUrl:`https://github.com/${owner}/${repo}`,commitRef:'main',commitSha:sha,ci:true,ciType:'github-actions',ciGitProviderUsername:owner,ciGitRepoVisibility:'public'}
          }));
          NODE
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${request_file}" \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1")"
          rm -f "$request_file"
          if [[ "$status" != "200" && "$status" != "201" && "$status" != "202" ]]; then
            detail="$(node - "$response_file" <<'NODE'
          const fs=require('node:fs');try{const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const e=b?.error||b;process.stdout.write(String(e?.message||e?.code||'Deployment create failed').slice(0,600))}catch{process.stdout.write('Unable to read Vercel deployment error')}
          NODE
            )"
            rm -f "$response_file"
            echo "::error title=Staged deployment creation failed::HTTP ${status}: ${detail}"
            exit 81
          fi
          deployment_id="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!b.id)process.exit(2);process.stdout.write(b.id)" "$response_file")"
          deployment_url="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!b.url)process.exit(2);process.stdout.write('https://'+b.url)" "$response_file")"
          rm -f "$response_file"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          echo "candidate_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Created staged production candidate ${deployment_id} with automatic domain assignment disabled."

      - name: Wait for staged candidate readiness and prove production alias is untouched
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 120); do
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"
            if [ "$status" != "200" ]; then sleep 5; continue; fi
            state="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(b.readyState||b.status||'UNKNOWN')" "$response_file")"
            deployed_sha="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(b?.meta?.githubCommitSha||'')" "$response_file")"
            alias_bound="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(Array.isArray(b.alias)&&b.alias.includes(process.env.VERCEL_PRODUCTION_ALIAS)?'1':'0')" "$response_file")"
            echo "Candidate state=${state}; production alias bound=${alias_bound}"
            if [[ "$state" == "ERROR" || "$state" == "CANCELED" ]]; then echo "::error title=Staged Vercel candidate failed::${state}"; exit 82; fi
            if [ "$state" = "READY" ]; then
              if [ -n "$deployed_sha" ] && [ "$deployed_sha" != "$CI_PASSED_SHA" ]; then echo "::error title=Candidate commit mismatch::${deployed_sha}"; exit 83; fi
              if [ "$alias_bound" = "1" ]; then echo "::error title=Unsafe early promotion::Production alias moved before Golden Medical Eval."; exit 84; fi
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Staged Vercel timeout::Candidate did not become READY within 10 minutes."
          exit 85

      - name: Candidate health preflight
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.stage.outputs.candidate_url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/yhct-health.json --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --header "x-yhct-golden-eval: ${AI_GOLDEN_EPHEMERAL_KEY}" \
            "${CANDIDATE_URL}/api/health")"
          if [ "$status" != "200" ]; then
            echo "::error title=Candidate health failed::Immutable staged deployment returned HTTP ${status}."
            exit 86
          fi
          echo "Candidate health preflight passed."

      - name: Live Golden Medical Eval release gate
        shell: bash
        env:
          AI_GOLDEN_TARGET: ${{ steps.stage.outputs.candidate_url }}
          AI_GOLDEN_REPORT: ai-golden-medical-report.json
        run: |
          set -euo pipefail
          node scripts/ai-golden-medical-eval.mjs --runtime

      - name: Upload live Golden Medical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-medical-${{ env.CI_PASSED_SHA }}
          path: ai-golden-medical-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Promote only the Golden-passed staged deployment
        id: promote
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"
          if [[ "$status" != "200" && "$status" != "201" && "$status" != "202" ]]; then
            detail="$(cat "$response_file" | head -c 600)";rm -f "$response_file";echo "::error title=Golden-passed promotion failed::HTTP ${status}: ${detail}";exit 87
          fi
          rm -f "$response_file"
          echo "url=https://${VERCEL_PRODUCTION_ALIAS}" >> "$GITHUB_OUTPUT"

      - name: Verify promoted exact deployment and production health
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"
            if [ "$status" = "200" ]; then
              alias_bound="$(node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(Array.isArray(b.alias)&&b.alias.includes(process.env.VERCEL_PRODUCTION_ALIAS)?'1':'0')" "$response_file")"
              if [ "$alias_bound" = "1" ] && curl --fail --silent --show-error "https://${VERCEL_PRODUCTION_ALIAS}/api/health" >/tmp/yhct-production-health.json; then
                echo "Golden-passed candidate is now the healthy production deployment."
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error title=Production promotion verification failed::Exact staged deployment was not bound healthy within 3 minutes."
          exit 88

      - name: Real Google Chrome production smoke
        shell: bash
        env:
          CHROME_SMOKE_URL: ${{ steps.promote.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node scripts/chrome-real-smoke.mjs && node scripts/chrome-production-content-check.mjs && node scripts/mobile-shell-responsive-check.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then echo "::error title=Production Chrome smoke failed::Chrome smoke failed after 3 isolated attempts.";exit 1;fi
            pkill -f 'google-chrome.*remote-debugging-port=9222' || true
            pkill -f 'google-chrome.*remote-debugging-port=9223' || true
            pkill -f 'google-chrome.*remote-debugging-port=956' || true
            rm -rf /tmp/yhct-chrome-* /tmp/yhct-mobile-shell-* || true
            sleep 2
          done

      - name: Revoke ephemeral Vercel automation bypass
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "No automation bypass was created."
            exit 0
          fi
          export BYPASS_SECRET="${VERCEL_AUTOMATION_BYPASS_SECRET}"
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          node - "$request_file" <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({revoke:{secret:process.env.BYPASS_SECRET,regenerate:false}}));
          NODE
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${request_file}" \
            "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_ORG_ID}")"
          rm -f "$request_file"
          if [ "$status" != "200" ]; then
            detail="$(cat "$response_file" | head -c 600)"
            rm -f "$response_file"
            echo "::error title=Automation bypass cleanup failed::HTTP ${status}: ${detail}"
            exit 89
          fi
          rm -f "$response_file"
          echo "Ephemeral Vercel automation bypass revoked."

      - name: Upload production Chrome QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-chrome-smoke-${{ env.CI_PASSED_SHA }}
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release summary
        run: |
          {
            echo "### Golden-gated Vercel production release"
            echo "- Commit: \`${CI_PASSED_SHA}\`"
            echo "- Staged candidate: ${{ steps.stage.outputs.candidate_url }}"
            echo "- Golden Medical live gate: passed"
            echo "- Production alias: ${{ steps.promote.outputs.url }}"
            echo "- Production Chrome smoke: passed on 390x844 mobile and 1440x1000 desktop"
            echo "- Structural mobile assistant gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"