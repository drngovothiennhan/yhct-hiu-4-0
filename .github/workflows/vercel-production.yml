name: Vercel Production

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_SCOPE: hiu-yhct
      VERCEL_PROJECT_ID: prj_7DWP3LX30CFALUD1KoNeOR8NlpsQ
      VERCEL_PROJECT_NAME: yhct-hiu-final4-stage
      VERCEL_PRODUCTION_ALIAS: yhct-hiu-final4-stage.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CI_PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require release credentials and exact CI commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error title=Missing VERCEL_TOKEN::Production release is fail-closed."
            exit 78
          fi
          if ! [[ "$CI_PASSED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid CI commit::Unexpected commit SHA."
            exit 78
          fi

      - name: Checkout exact CI-passed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_PASSED_SHA }}
          fetch-depth: 1

      - name: Use CI-proven Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CI_PASSED_SHA" ]; then
            echo "::error title=Commit mismatch::Checked out ${actual}, expected ${CI_PASSED_SHA}."
            exit 79
          fi

      - name: Install Vercel CLI for staged production control
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Link repository workspace to production project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node - <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('.vercel/project.json',JSON.stringify({
            orgId:process.env.VERCEL_ORG_ID,
            projectId:process.env.VERCEL_PROJECT_ID,
            projectName:process.env.VERCEL_PROJECT_NAME
          },null,2));
          NODE

      - name: Verify Vercel token project access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          if [ "$status" != "200" ]; then
            detail="$(node - "$response_file" <<'NODE'
          const fs=require('node:fs');
          const file=process.argv[2];
          try {
            const body=JSON.parse(fs.readFileSync(file,'utf8'));
            const error=body?.error||body;
            process.stdout.write(String(error?.message||error?.code||'Access denied').slice(0,400));
          } catch {
            process.stdout.write('Unable to read Vercel API error');
          }
          NODE
            )"
            rm -f "$response_file"
            echo "::error title=VERCEL_TOKEN scope mismatch::Vercel project probe returned HTTP ${status}: ${detail}"
            exit 80
          fi
          rm -f "$response_file"
          echo "Vercel token can access production project."

      - name: Generate deployment-scoped Golden Eval credential
        shell: bash
        run: |
          set -euo pipefail
          key="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::${key}"
          echo "AI_GOLDEN_EPHEMERAL_KEY=${key}" >> "$GITHUB_ENV"

      - name: Create staged production deployment without domain promotion
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          candidate_url="$(vercel deploy --prod --skip-domain --force --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_SCOPE" \
            --env "AI_GOLDEN_EPHEMERAL_KEY=${AI_GOLDEN_EPHEMERAL_KEY}")"
          candidate_url="$(printf '%s' "$candidate_url" | tail -n 1 | tr -d '\r')"
          if ! [[ "$candidate_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error title=Invalid staged deployment URL::${candidate_url}"
            exit 81
          fi
          if [ "$candidate_url" = "https://${VERCEL_PRODUCTION_ALIAS}" ]; then
            echo "::error title=Unsafe deployment::Staged candidate unexpectedly equals production alias."
            exit 81
          fi
          echo "candidate_url=${candidate_url}" >> "$GITHUB_OUTPUT"
          echo "Staged production candidate created without domain promotion."

      - name: Candidate health preflight through Vercel protection
        shell: bash
        run: |
          set -euo pipefail
          vercel curl /api/health \
            --deployment "${{ steps.stage.outputs.candidate_url }}" \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_SCOPE" \
            --fail-with-body --silent --show-error >/tmp/yhct-health.json
          node -e "const fs=require('node:fs');const s=fs.readFileSync('/tmp/yhct-health.json','utf8');if(!s.trim())process.exit(2);console.log('Candidate health response received.')"

      - name: Live Golden Medical Eval release gate
        shell: bash
        env:
          AI_GOLDEN_TARGET: ${{ steps.stage.outputs.candidate_url }}
          AI_GOLDEN_VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
          AI_GOLDEN_VERCEL_SCOPE: ${{ env.VERCEL_SCOPE }}
          AI_GOLDEN_REPORT: ai-golden-medical-report.json
        run: |
          set -euo pipefail
          node scripts/ai-golden-medical-eval.mjs --runtime

      - name: Upload live Golden Medical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-medical-${{ env.CI_PASSED_SHA }}
          path: ai-golden-medical-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Promote only the Golden-passed staged deployment
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          vercel promote "${{ steps.stage.outputs.candidate_url }}" \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_SCOPE" \
            --timeout=5m
          echo "url=https://${VERCEL_PRODUCTION_ALIAS}" >> "$GITHUB_OUTPUT"

      - name: Verify promoted production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://${VERCEL_PRODUCTION_ALIAS}/api/health" >/tmp/yhct-production-health.json; then
              echo "Production health is reachable after Golden-gated promotion."
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Production health failed::Promoted alias did not become healthy."
          exit 82

      - name: Real Google Chrome production smoke
        shell: bash
        env:
          CHROME_SMOKE_URL: ${{ steps.promote.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node scripts/chrome-real-smoke.mjs && node scripts/chrome-production-content-check.mjs && node scripts/mobile-shell-responsive-check.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Production Chrome smoke failed::Chrome smoke failed after 3 isolated attempts."
              exit 1
            fi
            echo "::warning::Chrome smoke attempt ${attempt} hit a transient runner/CDP startup failure; cleaning Chrome and retrying."
            pkill -f 'google-chrome.*remote-debugging-port=9222' || true
            pkill -f 'google-chrome.*remote-debugging-port=9223' || true
            pkill -f 'google-chrome.*remote-debugging-port=956' || true
            rm -rf /tmp/yhct-chrome-* /tmp/yhct-mobile-shell-* || true
            sleep 2
          done

      - name: Upload production Chrome QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-chrome-smoke-${{ env.CI_PASSED_SHA }}
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release summary
        run: |
          {
            echo "### Golden-gated Vercel production release"
            echo "- Commit: \`${CI_PASSED_SHA}\`"
            echo "- Staged candidate: ${{ steps.stage.outputs.candidate_url }}"
            echo "- Golden Medical live gate: passed"
            echo "- Production alias: ${{ steps.promote.outputs.url }}"
            echo "- Production Chrome smoke: passed on 390x844 mobile and 1440x1000 desktop"
            echo "- Structural mobile assistant gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"
