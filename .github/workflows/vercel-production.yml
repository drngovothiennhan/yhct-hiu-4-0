name: Vercel Production

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_7DWP3LX30CFALUD1KoNeOR8NlpsQ
      VERCEL_TEAM_SLUG: hiu-yhct
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 59.11.7
    steps:
      - name: Require production deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error title=Missing VERCEL_TOKEN::Production deploy is fail-closed. Add the VERCEL_TOKEN secret to the GitHub production environment or repository Actions secrets."
            exit 78
          fi

      - name: Checkout CI-passed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Verify Vercel token project access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          if [ "$status" != "200" ]; then
            detail="$(node - "$response_file" <<'NODE'
          const fs=require('node:fs');
          const file=process.argv[2];
          try{
            const body=JSON.parse(fs.readFileSync(file,'utf8'));
            const error=body?.error||body;
            process.stdout.write(String(error?.message||error?.code||'Access denied').slice(0,400));
          }catch{process.stdout.write('Unable to read Vercel API error');}
          NODE
            )"
            rm -f "$response_file"
            echo "::error title=VERCEL_TOKEN scope mismatch::Vercel project probe returned HTTP ${status}: ${detail}"
            exit 79
          fi
          rm -f "$response_file"
          echo "Vercel token can access production project."

      - name: Link production project deterministically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('node:fs');
          const orgId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          if (!orgId || !projectId) throw new Error('Missing Vercel project identifiers');
          fs.writeFileSync('.vercel/project.json', `${JSON.stringify({ orgId, projectId }, null, 2)}\n`);
          NODE

      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope="$VERCEL_TEAM_SLUG"

      - name: Build production artifact
        run: vercel build --prod --scope="$VERCEL_TEAM_SLUG"

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --scope="$VERCEL_TEAM_SLUG")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"

      - name: Publish deployment summary
        run: |
          {
            echo "### Vercel production deployment"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
