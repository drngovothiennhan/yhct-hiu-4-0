name: ACC Drive Credential Guide

on:
  push:
    branches: [acc-drive-credential-guide-20260911]
    paths:
      - '.github/workflows/acc-drive-credential-guide.yml'

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc-drive-credential-guide-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire popup into ACC
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='src/components/admin/QuizImportCenter.tsx';
          let s=fs.readFileSync(path,'utf8');
          const importOld="import './quiz-import.css';";
          if(!s.includes("DriveCredentialGuide from './DriveCredentialGuide'")){
            if(!s.includes(importOld))throw new Error('quiz import css marker missing');
            s=s.replace(importOld,importOld+"\nimport DriveCredentialGuide from './DriveCredentialGuide';");
          }
          const marker=' {message&&<p className="qi-status"';
          if(!s.includes('<DriveCredentialGuide visible={driveConfigured===false}/>')){
            if(!s.includes(marker))throw new Error('ACC status marker missing');
            s=s.replace(marker,' <DriveCredentialGuide visible={driveConfigured===false}/>\n'+marker);
          }
          fs.writeFileSync(path,s);
          NODE
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Canonical gates and build
        run: |
          node scripts/acceptance-check.mjs
          node scripts/platform-upgrade-check.mjs
          npm run build
          grep -q "DriveCredentialGuide visible={driveConfigured===false}" src/components/admin/QuizImportCenter.tsx
          grep -q "GOOGLE_SERVICE_ACCOUNT_JSON" src/components/admin/DriveCredentialGuide.tsx
      - name: Commit verified popup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin/QuizImportCenter.tsx
          git commit -m 'feat(acc): show Google Drive credential guide popup' || true
          git rm .github/workflows/acc-drive-credential-guide.yml
          git commit -m 'chore(ci): remove temporary ACC guide workflow'
          git push origin HEAD:acc-drive-credential-guide-20260911
