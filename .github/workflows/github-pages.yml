name: GitHub Pages Fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/acceptance-check.mjs
      - run: npm audit --omit=dev --audit-level=high
      - name: Build portable Pages bundle
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Prepare SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Detect or enable GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Pages enablement notice
        if: steps.pages.outcome != 'success'
        run: echo "Portable GitHub Pages bundle passed all gates; repository Pages enablement is not accessible to this GitHub Actions integration, so deployment is skipped safely."
  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
