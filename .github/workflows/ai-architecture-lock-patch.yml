name: AI Architecture Lock Patch

on:
  push:
    branches: [ai-architecture-lock-20260911]
    paths:
      - '.github/workflows/ai-architecture-lock-patch.yml'

permissions:
  contents: write

concurrency:
  group: ai-architecture-lock-patch
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-architecture-lock-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical AI architecture migration
        run: |
          sed -i "s/re.subn(pattern, repl, text, count=1, flags=flags)/re.subn(pattern, lambda _: repl, text, count=1, flags=flags)/" scripts/_apply_ai_canonical_lock.py
          python scripts/_apply_ai_canonical_lock.py
          sed -i 's/A.I OpenAlex dành cho thành viên/Research A.I dành cho thành viên/g' src/components/research/ResearchCenter.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/central-rag-check.mjs')
          s=p.read_text(encoding='utf-8')
          old="requireText(researchMini,'Cloud + Drive RAG + Central RAG + OpenAlex','Research A.I Mini visibly communicates shared retrieval architecture');"
          new="requireText(researchMini,'Dùng tài liệu nội bộ','Research A.I visibly exposes explicit internal-context opt-in');\nrequireText(researchMini,'Nguồn công khai','Research A.I presents public evidence without exposing provider selection as product UX');\nrequireText(researchMini,'setUseInternal(false)','Research A.I consumes internal-context consent after each request');"
          if old not in s: raise SystemExit('missing stale RAG UI assertion')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/acceptance-check-v4.mjs')
          s=p.read_text(encoding='utf-8')
          old="need(researchMini,['Cloud + Drive RAG + Central RAG + OpenAlex','searchOpenAlex(text,6)','searchDriveRag',\"searchKnowledge(text,'all',5)\",'translateAcademic'],'Research AI shared retrieval');"
          new="need(researchMini,['Dùng tài liệu nội bộ','Nguồn công khai','setUseInternal(false)','searchPubMed(text,6)','searchOpenAlex(text,6)','searchClinicalTrials(text,4)','searchDriveRag',\"searchKnowledge(text,'all',5)\",'translateAcademic'],'Research AI canonical retrieval and request-scoped privacy');"
          if old not in s: raise SystemExit('missing stale global acceptance assertion')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/role-ui-audit.mjs')
          s=p.read_text(encoding='utf-8')
          old="['OpenAlex remains research-only',has(files.research,'searchOpenAlex(query,12)','A.I OpenAlex tổng hợp')&&has(files.researchMini,'searchOpenAlex(text,6)')&&has(files.mini,'academicIntent')&&not(files.mini,'searchOpenAlex','searchDriveRag','searchKnowledge')],"
          new="['Research retrieval remains research-only',has(files.research,'searchOpenAlex(query,12)','ragInternalConsent')&&has(files.researchMini,'searchPubMed(text,6)','searchOpenAlex(text,6)','searchClinicalTrials(text,4)')&&has(files.mini,'researchIntent')&&not(files.mini,'searchOpenAlex','searchPubMed','searchClinicalTrials','searchDriveRag','searchKnowledge')],"
          if old not in s: raise SystemExit('missing stale role audit research assertion')
          s=s.replace(old,new,1)
          old2="['AI Mini is application assistant without research or feedback overlap',has(files.mini,'Trợ lý ứng dụng','Điểm rèn luyện','Tín dụng','Thông báo','Lịch CLB','Học thuật → Trung tâm nghiên cứu','openResearch(text)')&&has(files.miniService,\"mode:'xiaozhi-mini'\",'hiu.vn','fanpage chính thức')&&not(files.mini,'askAcademicUnified','feedback_submit_v1',\"Mode='assistant'|'feedback'\")&&not(files.app,'AiMiniFeedbackDock','PersonalCopilotWidget')],"
          new2="['AI Mini is application assistant without research or feedback overlap',has(files.mini,'Trợ lý ứng dụng','askXiaoZhiMini','researchIntent','openResearch(text)','VOICE_KEY','startListening')&&has(files.miniService,\"mode:'xiaozhi-mini'\",'hiu.vn','fanpage chính thức')&&not(files.mini,'askAcademicUnified','feedback_submit_v1','searchOpenAlex','searchPubMed','searchClinicalTrials','searchDriveRag','searchKnowledge')&&not(files.app,'AiMiniFeedbackDock','PersonalCopilotWidget')],"
          if old2 not in s: raise SystemExit('missing stale app-assistant role assertion')
          s=s.replace(old2,new2,1).replace('Gemini application assistant','application assistant')
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/module-isolation-check.mjs')
          s=p.read_text(encoding='utf-8')
          replacements={
            "need(research,['searchOpenAlex(query,12)','A.I OpenAlex tổng hợp','summarizeOpenAlex','askServerAi'],'research OpenAlex AI');":"need(research,['searchOpenAlex(query,12)','ragInternalConsent','Research A.I tổng hợp nguồn vừa tìm','summarizeOpenAlex','askServerAi'],'research public retrieval');",
            "need(researchMini,['searchOpenAlex(text,6)','searchDriveRag(text,4,controller.signal)',\"searchKnowledge(text,'all',5)\",\"askServerAi(leaderPrompt,'research'\",'RESEARCH_LEADER=GEMINI','threadContext(messages)','result.suggestedQueries','Cloud + Drive RAG + Central RAG + OpenAlex'],'Research AI mini Gemini leader orchestration');":"need(researchMini,['searchPubMed(text,6)','searchOpenAlex(text,6)','searchClinicalTrials(text,4)','internalEnabled?searchDriveRag(text,4,controller.signal)',\"internalEnabled?searchKnowledge(text,'all',5)\",\"askServerAi(leaderPrompt,'research'\",'RESEARCH_LEADER=GEMINI','threadContext(messages)','result.suggestedQueries','Dùng tài liệu nội bộ','setUseInternal(false)'],'Research AI canonical orchestration');",
            "need(mini,['academicIntent','askXiaoZhiMini','VOICE_KEY','startListening','Học thuật → Trung tâm nghiên cứu','openResearch(text)'],'global XiaoZhi AI mini system/voice routing');":"need(mini,['researchIntent','askXiaoZhiMini','VOICE_KEY','startListening','Trung tâm nghiên cứu','openResearch(text)'],'global XiaoZhi app-assistant text/voice routing');",
            "forbid(mini,['searchOpenAlex','searchDriveRag','searchKnowledge','centralKnowledgeService','askAcademicUnified','feedback_submit_v1'],'global XiaoZhi AI mini academic separation');":"forbid(mini,['searchOpenAlex','searchPubMed','searchClinicalTrials','searchDriveRag','searchKnowledge','centralKnowledgeService','askAcademicUnified','feedback_submit_v1'],'global XiaoZhi AI mini academic separation');",
            "module-isolation-ok: 10 final areas frozen, inbox embedded in profile, admin/ACC separation, root PWA install, Gemini Research leader with Central/Drive/OpenAlex workers, and application-assistant XiaoZhi separation present":"module-isolation-ok: 10 final areas frozen, inbox embedded in profile, admin/ACC separation, root PWA install, Research A.I with request-scoped internal consent, and application-assistant XiaoZhi separation present"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'missing stale module assertion: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Required AI gates
        run: |
          npm run audit:ai
          npm run audit:ai-roles
          npm run audit:rag
          npm run build
      - name: Commit verified migration and remove temporary tooling
        run: |
          git rm scripts/_apply_ai_canonical_lock.py .github/workflows/ai-architecture-lock-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ai): enforce canonical architecture lock"
          git push origin HEAD:ai-architecture-lock-20260911
