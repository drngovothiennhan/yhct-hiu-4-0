name: AI Architecture Lock Patch

on:
  push:
    branches: [ai-architecture-lock-20260911]
    paths:
      - '.github/workflows/ai-architecture-lock-patch.yml'

permissions:
  contents: write

concurrency:
  group: ai-architecture-lock-patch
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-architecture-lock-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical AI architecture migration
        run: |
          sed -i "s/re.subn(pattern, repl, text, count=1, flags=flags)/re.subn(pattern, lambda _: repl, text, count=1, flags=flags)/" scripts/_apply_ai_canonical_lock.py
          python scripts/_apply_ai_canonical_lock.py
          sed -i 's/A.I OpenAlex dành cho thành viên/Research A.I dành cho thành viên/g' src/components/research/ResearchCenter.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/central-rag-check.mjs')
          s=p.read_text(encoding='utf-8')
          old="requireText(researchMini,'Cloud + Drive RAG + Central RAG + OpenAlex','Research A.I Mini visibly communicates shared retrieval architecture');"
          new="requireText(researchMini,'Dùng tài liệu nội bộ','Research A.I visibly exposes explicit internal-context opt-in');\nrequireText(researchMini,'Nguồn công khai','Research A.I presents public evidence without exposing provider selection as product UX');\nrequireText(researchMini,'setUseInternal(false)','Research A.I consumes internal-context consent after each request');"
          if old not in s: raise SystemExit('missing stale RAG UI assertion')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/acceptance-check-v4.mjs')
          s=p.read_text(encoding='utf-8')
          old="need(researchMini,['Cloud + Drive RAG + Central RAG + OpenAlex','searchOpenAlex(text,6)','searchDriveRag',\"searchKnowledge(text,'all',5)\",'translateAcademic'],'Research AI shared retrieval');"
          new="need(researchMini,['Dùng tài liệu nội bộ','Nguồn công khai','setUseInternal(false)','searchPubMed(text,6)','searchOpenAlex(text,6)','searchClinicalTrials(text,4)','searchDriveRag',\"searchKnowledge(text,'all',5)\",'translateAcademic'],'Research AI canonical retrieval and request-scoped privacy');"
          if old not in s: raise SystemExit('missing stale global acceptance assertion')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Required AI gates
        run: |
          npm run audit:ai
          npm run audit:ai-roles
          npm run audit:rag
          npm run build
      - name: Commit verified migration and remove temporary tooling
        run: |
          git rm scripts/_apply_ai_canonical_lock.py .github/workflows/ai-architecture-lock-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ai): enforce canonical architecture lock"
          git push origin HEAD:ai-architecture-lock-20260911
