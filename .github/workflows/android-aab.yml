name: Android AAB API 36
on:
  workflow_dispatch:
  push:
    branches:
      - release/playstore-api36-20260916
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build native web bundle
        run: npx tsc -b && npx vite build
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Target Android 16 / API 36
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/' android/variables.gradle
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle
      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: yhct-hiu-api36-native-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
