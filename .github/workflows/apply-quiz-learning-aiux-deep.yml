name: Apply deep quiz learning AIUX
on:
  push:
    branches: [quiz-learning-aiux-deep-20260911]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat(quiz): deep approved-bank learning pipeline') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quiz-learning-aiux-deep-20260911
          fetch-depth: 0
      - name: Apply bounded patch
        run: python3 scripts/apply-quiz-learning-aiux-deep.py
      - name: Validate patch anchors and TypeScript contracts
        run: |
          node scripts/quiz-learning-pipeline-check.mjs
          node scripts/v22-quiz-import-check.mjs
          node scripts/ai-role-contract-check.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(quiz): deep approved-bank learning pipeline and compact AI Mini UX"
          git push origin HEAD:quiz-learning-aiux-deep-20260911
