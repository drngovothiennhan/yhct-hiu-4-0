name: Web CI

on:
  push:
    branches: [main, rc-platform-v1-20260907, audit-mobile-hotfix-20260907]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'android/**'
      - 'capacitor.config.*'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'android/**'
      - 'capacitor.config.*'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/acceptance-check.mjs
      - run: node scripts/platform-upgrade-check.mjs
      - run: node scripts/feed-ai-contract-check.mjs
      - run: node scripts/research-provider-contract-check.mjs
      - run: node scripts/garden-water-contract-check.mjs
      - run: node scripts/garden-fertilizer-contract-check.mjs
      - name: HIU Y Quan V20 unified contract
        run: node scripts/v20-yquan-unified-contract-check.mjs
      - name: HIU Y Quan V20 mobile typography and patient visual contract
        run: node scripts/v20-yquan-mobile-typography-check.mjs
      - name: HIU Y Quan V20 actor runtime playthrough
        run: node scripts/v20-yquan-runtime-playthrough.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Real Google Chrome responsive smoke
        run: node scripts/chrome-real-smoke.mjs
      - name: Adaptive mobile, full desktop-on-phone and Win11 viewport matrix
        run: node scripts/adaptive-viewport-check-v2.mjs
      - name: Upload Chrome QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-smoke-${{ github.sha }}
          path: |
            browser-artifacts/
            adaptive-viewport-artifacts/
          if-no-files-found: warn
          retention-days: 1
      - run: node -e "const fs=require('fs'); for(const f of ['dist/index.html','dist/manifest.webmanifest','dist/service-worker.js']) if(!fs.existsSync(f)){console.error('missing '+f);process.exit(1)}"