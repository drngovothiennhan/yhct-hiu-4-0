name: Web CI

on:
  push:
    branches: [main, rc-platform-v1-20260907, audit-mobile-hotfix-20260907]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'android/**'
      - 'capacitor.config.*'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'android/**'
      - 'capacitor.config.*'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/acceptance-check.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: node -e "const fs=require('fs'); for(const f of ['dist/index.html','dist/manifest.webmanifest','dist/service-worker.js']) if(!fs.existsSync(f)){console.error('missing '+f);process.exit(1)}"
