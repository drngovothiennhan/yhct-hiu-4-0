name: Canonical Platform Gate Sync

on:
  push:
    branches: [ai-architecture-lock-20260911]
    paths:
      - '.github/workflows/canonical-platform-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-architecture-lock-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align platform assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/platform-upgrade-check.mjs'); s=p.read_text(encoding='utf-8')
          old="need(mini.includes('checkDrlConversation')&&mini.includes('fetchSchedules')&&mini.includes('askXiaoZhiMini')&&mini.includes('academicIntent'),'AI Mini is system/club/web focused with academic intent routing');"
          new="need(mini.includes('checkDrlConversation')&&mini.includes('fetchSchedules')&&mini.includes('askXiaoZhiMini')&&mini.includes('researchIntent')&&mini.includes('openResearch(text)'),'AI Mini is application-assistant focused with explicit deep-research handoff');"
          if old not in s: raise SystemExit('missing legacy Mini platform assertion')
          s=s.replace(old,new,1)
          old="need(research.includes('searchOpenAlex(query,12)')&&research.includes('A.I OpenAlex tổng hợp')&&researchMini.includes('searchOpenAlex(text,6)')&&researchMini.includes(\"searchKnowledge(text,'all',5)\")&&researchMini.includes('Cloud + Drive RAG + Central RAG + OpenAlex'),'OpenAlex and Central RAG remain in Research Center and Research AI Mini');"
          new="need(research.includes('searchOpenAlex(query,12)')&&research.includes('ragInternalConsent')&&researchMini.includes('searchPubMed(text,6)')&&researchMini.includes('searchOpenAlex(text,6)')&&researchMini.includes('searchClinicalTrials(text,4)')&&researchMini.includes(\"searchKnowledge(text,'all',5)\")&&researchMini.includes('Dùng tài liệu nội bộ')&&researchMini.includes('setUseInternal(false)'),'Research A.I owns academic retrieval and request-scoped internal consent');"
          if old not in s: raise SystemExit('missing legacy Research platform assertion')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: node scripts/platform-upgrade-check.mjs
      - name: Commit platform gate alignment
        run: |
          git rm -f .github/workflows/canonical-platform-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/platform-upgrade-check.mjs
          git commit -m "test(ai): align platform gate with canonical architecture"
          git push origin HEAD:ai-architecture-lock-20260911
