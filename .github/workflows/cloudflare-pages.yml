name: Cloudflare Pages Fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/acceptance-check.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Detect Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Cloudflare Pages project when absent
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if ! npx --yes wrangler@4 pages project list --json | jq -e '.[] | select(.name == "yhct-hiu-4-0")' >/dev/null; then
            npx --yes wrangler@4 pages project create yhct-hiu-4-0 --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name=yhct-hiu-4-0 --branch=main
      - name: Cloudflare credential notice
        if: steps.cloudflare.outputs.ready != 'true'
        run: echo "Cloudflare deploy skipped safely because CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN are not connected. Build and security gates still passed."
