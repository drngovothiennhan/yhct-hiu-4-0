name: Study OS standalone HTML
on:
  push:
    branches: [claude/study-os-standalone-html]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-standalone.mjs
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/standalone-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: study-os-standalone
          path: |
            dist-standalone/study-os-standalone.html
            dist-standalone/standalone-phone.png
          retention-days: 14
