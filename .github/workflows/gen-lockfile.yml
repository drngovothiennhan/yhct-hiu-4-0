name: Generate Lockfile (temporary)
on:
  push:
    branches: [claude/add-lockfile]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if [ ! -f package-lock.json ]; then echo "::error::package-lock.json was not generated"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): add package-lock.json generated on Node 22" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:claude/add-lockfile
