          new="need(quiz,['createGeminiJson','geminiAiConfigured','gemini-quiz-designer-v1','Chỉ được dùng thông tin nằm trong SOURCE',\"reviewStatus:'expert_approved'\",'adminConfirmed:true','sourceEvidence.includes(evidence.toLowerCase())','!explanation',\"driveConfigured:credentialMode!=='none'\",'clean(body.subjectName,160)'],'Gemini quiz designer and Drive readiness');\nneed(acc,['Tài liệu → Ngân hàng trắc nghiệm','conversionMode','Gemini thiết kế trắc nghiệm từ tài liệu','Tải tài liệu trực tiếp tại ACC','Đồng bộ & chuyển đổi','setChecked(new Set())','Tất cả kết quả chỉ ở trạng thái bản nháp','driveConfigured===false','manualSubject.trim()','subjectName','Drive tạm chưa khả dụng'],'ACC Drive-to-quiz UX with direct-upload fallback');"
          if old not in s: raise SystemExit('missing AI role quiz contract anchor')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies without lockfile mutation
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Required gates
        run: |
          npm run audit:ai
          npm run audit:ai-roles
          npm run audit:rag
          npm run build
      - name: Commit verified hotfix and remove temporary workflow
        run: |
          git rm -f .github/workflows/acc-quiz-interaction-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/quiz-workspace.js src/components/admin/QuizImportCenter.tsx src/components/admin/quiz-import.css scripts/ai-role-contract-check.mjs
          git commit -m "fix(acc): restore quiz Drive and direct Word interactions"
          git push origin HEAD:ai-architecture-lock-20260911
