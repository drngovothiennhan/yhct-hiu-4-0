name: Adaptive Device Sync

on:
  workflow_run:
    workflows: ["Vercel Production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: adaptive-device-sync-main
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify adaptive mobile and Win11 layout on production
        env:
          CHROME_SMOKE_URL: https://yhct-hiu-final4-stage.vercel.app
        run: node scripts/adaptive-viewport-check.mjs
      - name: Upload adaptive viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-device-sync-${{ github.event.workflow_run.head_sha }}
          path: adaptive-viewport-artifacts/
          if-no-files-found: warn
          retention-days: 1
      - name: Publish verification summary
        run: echo "Adaptive production matrix passed for mobile 390 and Win11 1024/1366/1920 viewports." >> "$GITHUB_STEP_SUMMARY"
