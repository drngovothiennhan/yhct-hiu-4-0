name: HIU TMC Ecosystem CI

on:
  push:
    branches:
      - ecosystem-hub-stage-a
    paths:
      - "ecosystem-hub/app/**"
      - "ecosystem-hub/components/**"
      - "ecosystem-hub/data/**"
      - "ecosystem-hub/public/**"
      - "ecosystem-hub/scripts/**"
      - "ecosystem-hub/package.json"
      - "ecosystem-hub/next.config.ts"
      - "ecosystem-hub/tsconfig.json"
      - "ecosystem-hub/wrangler.jsonc"
      - ".github/workflows/ecosystem-hub-stage-a.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ecosystem-hub/**"
      - ".github/workflows/ecosystem-hub-stage-a.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiu-tmc-ecosystem-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecosystem-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ecosystem-hub/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate app registry
        run: npm run validate:registry
      - name: Validate map assets
        run: npm run validate:assets
      - name: Build static export
        run: npm run build
      - name: Verify export
        run: |
          test -f out/index.html
          test -f out/ecosystem/study-os/index.html
          test -f out/ecosystem/ai-thiet-chan/index.html
          test -f out/ecosystem/trung-y-van/index.html
          test -f out/ecosystem/atlas/index.html

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiu-tmc-ecosystem-static
          path: ecosystem-hub/out
          if-no-files-found: error
          retention-days: 14
